name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - staging
      - prod

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, Node tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Node tests
        run: npx vitest run --project=node

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Build
        run: npm run build
        env:
          FIREBASE_API_KEY: dummy-api-key
          FIREBASE_PROJECT_ID: dummy-project-id
          SESSION_SECRET: dummy-session-secret-for-ci-build-only
          DEV_AUTH_BYPASS: "false"

  storybook:
    name: Storybook tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        playwright: ["1.61.0"]
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
      options: --init --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Verify Playwright image version
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
        run: |
          node <<'NODE'
          const locked = require("./package-lock.json").packages["node_modules/playwright"].version;
          if (locked !== process.env.PLAYWRIGHT_VERSION) {
            throw new Error(`Playwright ${locked} requires updating the playwright matrix version in pr-checks.yml.`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Storybook tests
        run: npx vitest run --project=storybook --shard=${{ matrix.shard }}/2

  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    needs: [quality, storybook]
    if: ${{ always() }}
    steps:
      - name: Require all checks to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          STORYBOOK_RESULT: ${{ needs.storybook.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$STORYBOOK_RESULT" = success
